{% include header.html %}
<article class="post-detail">
  <header class="page-intro post-header">
    <p class="eyebrow">MEL Lab News</p>
    <h1>{{ page.title }}</h1>
    <p class="post-meta">{{ page.date | date: "%Y.%m.%d" }} · {{ page.author }}</p>
  </header>
  <div class="post-body">
    {{ content }}
    {% if page.photos %}
    <section class="news-gallery" aria-label="관련 사진">
      <div id="news-photos" class="carousel slide" data-interval="false" tabindex="0" aria-label="사진 슬라이드">
        <div class="carousel-inner">
          {% for photo in page.photos %}
          <figure class="item{% if forloop.first %} active{% endif %}">
            <img src="{{ photo.src }}" alt="{{ photo.caption | escape }}">
            <figcaption>{{ forloop.index }} / {{ page.photos.size }} · {{ photo.caption }}</figcaption>
          </figure>
          {% endfor %}
        </div>
        <div class="carousel-indicators news-gallery-controls">
          {% for photo in page.photos %}
          <button{% if forloop.first %} class="active"{% endif %} type="button" data-target="#news-photos" data-slide-to="{{ forloop.index0 }}" aria-label="사진 {{ forloop.index }}: {{ photo.caption | escape }}"></button>
          {% endfor %}
        </div>
      </div>
    </section>
    {% endif %}
  </div>
</article>
{% include footer.html %}
