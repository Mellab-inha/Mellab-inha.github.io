{% include header.html %}
<article class="post-detail">
  <header class="page-intro post-header">
    <p class="eyebrow">MEL Lab News</p>
    <h1>{{ page.title }}</h1>
    <p class="post-meta">{{ page.date | date: "%Y.%m.%d" }} · {{ page.author }}</p>
  </header>
  <div class="post-body">
    {{ content }}
  </div>
</article>
