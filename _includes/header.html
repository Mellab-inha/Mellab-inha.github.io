<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.name }}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="{{ site.description | strip_newlines | escape }}">
    <meta name="theme-color" content="#0c2d57">
    <link href="/static/css/bootstrap.css" rel="stylesheet">
    <link href="/static/css/syntax.css" rel="stylesheet">
    <link href="/static/css/custom.css" rel="stylesheet">
    {% if page.group == 'news' %}
    <link rel="alternate" type="application/atom+xml" title="MEL Lab News Feed" href="/news.xml">
    {% endif %}
  </head>
  <body class="page-{{ page.group | default: 'default' }}">
    <a class="skip-link" href="#main-content">본문으로 바로가기</a>
    <header class="site-header">
      <nav class="navbar navbar-default" aria-label="주요 메뉴">
        <div class="site-shell">
          <div class="navbar-header">
            <button type="button" class="navbar-toggle collapsed" data-toggle="collapse" data-target="#site-navigation" aria-expanded="false">
              <span class="sr-only">메뉴 열기</span>
              <span class="icon-bar"></span>
              <span class="icon-bar"></span>
              <span class="icon-bar"></span>
            </button>
            <a class="navbar-brand" href="/">
              <span class="brand-mark">MEL</span>
              <span class="brand-copy">
                <strong>Measurement Engineering Lab</strong>
                <small>Inha University</small>
              </span>
            </a>
          </div>
          <div id="site-navigation" class="navbar-collapse collapse">
            <ul class="nav navbar-nav navbar-right">
              {% for link in site.data.navlinks %}
                <li{% if page.group == link.group %} class="active"{% endif %}>
                  <a href="{{ link.link }}">{{ link.name }}</a>
                </li>
              {% endfor %}
            </ul>
          </div>
        </div>
      </nav>
    </header>
    <main id="main-content" class="{% if page.group == 'home' %}home-main{% else %}site-main site-shell{% endif %}">
